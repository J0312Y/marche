<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Lamuka Market - Marketplace Congo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
    <!-- Police chargée sans bloquer le premier affichage (sinon écran vide tant que Google Fonts ne répond pas) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  </head>
  <body style="margin:0;background:#00B492">
    <!-- Même écran que le lancement natif, affiché avant le JavaScript ; remplacé par l'application au démarrage -->
    <div id="root"><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#00B492"><span style="color:#fff;font-family:'Segoe UI','Noto Sans',system-ui,sans-serif;font-style:italic;font-weight:700;font-size:42px;letter-spacing:-1px">lamuka</span></div></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up any leftover service worker
      if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(w=>w.unregister()))}
    </script>
  </body>
</html>
